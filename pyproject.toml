[project]
name = "meeting-room-booking-service"
version = "0.1.0"
description = ""
authors = [
    { name = "Kotbuz", email = "wasdtv03@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.139.2,<0.140.0",
    "uvicorn>=0.51.0,<0.52.0",
    "sqlalchemy>=2.0.51,<3.0.0",
    "alembic>=1.18.5,<2.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "python-jose[cryptography]>=3.5.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt==4.0.1",
    "psycopg>=3.3.4,<4.0.0",
    "pwdlib[argon2]>=0.3.0,<0.4.0",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
]